<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2a3d8f">
<title>X-Cite Flooring</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/remixicon@4.3.0/fonts/remixicon.css" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<!-- Login screen -->
<div id="login-screen">
  <div class="login-wrap">
    <div class="login-logo"><span class="lx">X-CITE</span> FLOORING</div>
    <div class="login-tagline">Admin Portal</div>
    <div class="login-box">
      <div class="login-title">Welcome back</div>
      <div class="login-hint">Sign in to continue</div>
      <label>Username</label>
      <input id="lu" type="text" placeholder="Enter username" autocomplete="username" onkeydown="if(event.key==='Enter')document.getElementById('lp').focus()">
      <label>Password</label>
      <div class="pass-wrap">
        <input id="lp" type="password" placeholder="••••••••" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
        <button type="button" class="pass-eye" onclick="togglePass()" title="Show/hide"><i id="eye-icon" class="ri-eye-line"></i></button>
      </div>
      <div id="lerr" class="login-err"></div>
      <button class="btn login-btn" onclick="doLogin()"><i class="ri-login-box-line"></i> Sign In</button>
    </div>
    <div class="login-footer">X-Cite Flooring · Admin Portal</div>
  </div>
</div>

<div id="app">
  <header class="topbar">
    <div class="brand"><span class="x">X-CITE</span> FLOORING</div>
    <div style="display:flex;align-items:center;gap:10px">
      <span id="sync-dot" class="sync-dot idle" title="Connecting…"></span>
      <button class="btn-logout" onclick="doLogout()" title="Sign out"><i class="ri-logout-box-r-line"></i></button>
    </div>
  </header>
  <main id="view"></main>
  <nav class="tabs" id="tabs"></nav>
</div>
<div id="modal" class="modal hidden"><div class="modal-box" id="modal-box"></div></div>
<div id="print"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="app.js"></script>
</body>
</html>
